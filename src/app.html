<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="title" content="Nathan Laha" />
	<meta name="keywords"
		content="Software Engineer, DevOps, Cloud, AI, Developer, Coder, Personal Website, TypeScript, C#, JavaScript, HTML, CSS, Python, Data Science" />
	<meta name="robots" content="index, follow" />
	<meta name="language" content="English" />

	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://nlaha.com/" />
	<meta property="og:site_name" content="Nathan Laha" />
	<meta property="og:locale" content="en_US" />
	<meta name="twitter:card" content="summary" />
	<link rel="canonical" href="https://nlaha.com/" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="/favicon.ico" type="image/x-icon" />
	<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
	<script>
		// Theme detection script to prevent FOUC (Flash of Unstyled Content)
		// This runs immediately when the page loads, before any content is rendered
		(function () {
			const isDark = localStorage.theme === 'dark' ||
				(!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);

			if (isDark) {
				document.documentElement.classList.add('dark');
			} else {
				document.documentElement.classList.remove('dark');
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="dark:bg-gray-900">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
